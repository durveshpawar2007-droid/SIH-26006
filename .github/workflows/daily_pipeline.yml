name: Daily Market Data Pipeline

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run End-to-End Data Pipeline
        run: |
          python scripts/run_pipeline.py

      - name: Run Test Suite and Verification
        run: |
          pytest tests/test_pipeline.py -v

      - name: Commit and Push Updated Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Nothing to commit."
          else
            echo "Changes detected in data/. Committing and pushing..."
            git commit -m "chore(data): automated daily market data pipeline update [skip ci]"
            git push origin main
          fi
